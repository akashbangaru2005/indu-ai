name: Render cloud backend
on:
  push:
    paths: ['backend/**', 'benchmarks/cloud_smoke.py', 'render.yaml', '.python-version', '.github/workflows/render-cloud.yml']
  pull_request:
    paths: ['backend/**', 'benchmarks/cloud_smoke.py', 'render.yaml', '.python-version', '.github/workflows/render-cloud.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-render.txt
      - run: pip install -r backend/requirements-render.txt
      - run: pip check
      - run: python benchmarks/cloud_smoke.py
      - run: python -m unittest discover -s backend/tests -p test_live.py -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: render-cloud-smoke
          path: reports/render-cloud-smoke.json

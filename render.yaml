services:
  - type: web
    name: indu-ai-backend
    runtime: python
    buildCommand: pip install -r backend/requirements-render.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: INDU_DEPLOYMENT_MODE
        value: cloud
      - key: INDU_ALLOWED_HOSTS
        value: indu-ai.onrender.com,localhost,127.0.0.1
      - key: INDU_DATA_DIR
        value: /tmp/indu
      - key: GEMINI_API_KEY
        sync: false
      - key: INDU_ALLOWED_ORIGINS
        sync: false
